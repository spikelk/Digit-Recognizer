<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>手写数字识别</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }
        .description {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
        }
        .tab {
            padding: 10px 25px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f0f0f0;
            color: #666;
        }
        .tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .main-content {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }
        .input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        canvas {
            border: 3px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: crosshair;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .upload-area {
            width: 200px;
            height: 200px;
            border: 3px dashed #e0e0e0;
            border-radius: 10px;
            background: #fafafa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: #f5f5ff;
        }
        .upload-area.dragover {
            border-color: #667eea;
            background: #f0f0ff;
        }
        .upload-icon {
            font-size: 48px;
            margin-bottom: 10px;
            color: #ccc;
        }
        .upload-text {
            font-size: 14px;
            color: #666;
            text-align: center;
        }
        #uploadedImage {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 10px;
            display: none;
        }
        #fileInput {
            display: none;
        }
        .controls {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-clear {
            background: #f0f0f0;
            color: #333;
        }
        .btn-clear:hover {
            background: #e0e0e0;
        }
        .btn-predict {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-predict:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }
        .result-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 200px;
        }
        .result-box {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px 40px;
            text-align: center;
            min-width: 180px;
        }
        .digit {
            font-size: 72px;
            font-weight: bold;
            color: #333;
            margin-bottom: 10px;
        }
        .confidence {
            font-size: 18px;
            color: #666;
        }
        .loading {
            font-size: 16px;
            color: #667eea;
        }
        .instructions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }
        .instructions h3 {
            color: #333;
            margin-bottom: 10px;
        }
        .instructions ul {
            color: #666;
            line-height: 1.8;
            padding-left: 20px;
        }
        .input-panel {
            display: none;
        }
        .input-panel.active {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🧮 手写数字识别</h1>
        <p class="description">支持手写输入和图片上传两种方式</p>
        
        <div class="tabs">
            <button class="tab active" onclick="switchTab('draw')">✏️ 手写输入</button>
            <button class="tab" onclick="switchTab('upload')">📤 图片上传</button>
        </div>
        
        <div class="main-content">
            <div class="input-section">
                <div id="drawPanel" class="input-panel active">
                    <canvas id="drawingCanvas" width="200" height="200"></canvas>
                    <div class="controls">
                        <button class="btn-clear" onclick="clearCanvas()">清除</button>
                        <button class="btn-predict" onclick="predictDigit()">识别</button>
                    </div>
                </div>
                
                <div id="uploadPanel" class="input-panel">
                    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
                        <div class="upload-icon">📷</div>
                        <div class="upload-text">点击选择图片<br>或拖拽到此处</div>
                        <img id="uploadedImage" src="" alt="上传的图片">
                    </div>
                    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
                    <div class="controls">
                        <button class="btn-clear" onclick="clearUpload()">清除</button>
                        <button class="btn-predict" onclick="predictUploaded()">识别</button>
                    </div>
                </div>
            </div>
            
            <div class="result-section">
                <div class="result-box">
                    <div id="result" class="digit">?</div>
                    <div id="confidence" class="confidence">置信度: --</div>
                </div>
                <div id="loading" class="loading" style="display: none;">识别中...</div>
            </div>
        </div>
        
        <div class="instructions">
            <h3>使用说明</h3>
            <ul>
                <li><strong>手写输入:</strong> 使用鼠标或触摸屏在画板上书写数字</li>
                <li><strong>图片上传:</strong> 点击上传区域选择图片文件</li>
                <li>图片应为白底黑字的手写数字（建议28x28像素）</li>
                <li>点击"识别"按钮获取识别结果</li>
            </ul>
        </div>
    </div>

    <script>
        let currentTab = 'draw';
        let uploadedImageData = null;

        const canvas = document.getElementById('drawingCanvas');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 18;
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(touch.clientX - canvas.offsetLeft, touch.clientY - canvas.offsetTop);
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (!isDrawing) return;
            const touch = e.touches[0];
            ctx.lineTo(touch.clientX - canvas.offsetLeft, touch.clientY - canvas.offsetTop);
            ctx.stroke();
        });

        canvas.addEventListener('touchend', stopDrawing);

        function startDrawing(e) {
            isDrawing = true;
            ctx.beginPath();
            ctx.moveTo(e.offsetX, e.offsetY);
        }

        function draw(e) {
            if (!isDrawing) return;
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function clearCanvas() {
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            document.getElementById('result').textContent = '?';
            document.getElementById('confidence').textContent = '置信度: --';
        }

        function switchTab(tab) {
            currentTab = tab;
            
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelector(`.tab:nth-child(${tab === 'draw' ? '1' : '2'})`).classList.add('active');
            
            document.getElementById('drawPanel').classList.remove('active');
            document.getElementById('uploadPanel').classList.remove('active');
            document.getElementById(`${tab}Panel`).classList.add('active');
            
            document.getElementById('result').textContent = '?';
            document.getElementById('confidence').textContent = '置信度: --';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageData = e.target.result;
                    document.getElementById('uploadedImage').src = e.target.result;
                    document.getElementById('uploadedImage').style.display = 'block';
                    document.querySelector('.upload-area').style.borderStyle = 'solid';
                };
                reader.readAsDataURL(file);
            }
        }

        function clearUpload() {
            uploadedImageData = null;
            document.getElementById('uploadedImage').src = '';
            document.getElementById('uploadedImage').style.display = 'none';
            document.querySelector('.upload-area').style.borderStyle = 'dashed';
            document.getElementById('result').textContent = '?';
            document.getElementById('confidence').textContent = '置信度: --';
        }

        async function predictDigit() {
            const dataURL = canvas.toDataURL('image/png');
            await sendPrediction(dataURL);
        }

        async function predictUploaded() {
            if (!uploadedImageData) {
                alert('请先上传图片');
                return;
            }
            await sendPrediction(uploadedImageData);
        }

        async function sendPrediction(imageData) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('result').textContent = '?';
            document.getElementById('confidence').textContent = '置信度: --';

            try {
                const response = await fetch('/predict', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ image: imageData }),
                });

                const result = await response.json();
                
                document.getElementById('result').textContent = result.digit;
                document.getElementById('confidence').textContent = `置信度: ${result.confidence.toFixed(2)}%`;
            } catch (error) {
                document.getElementById('result').textContent = 'Error';
                document.getElementById('confidence').textContent = '识别失败';
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        clearCanvas();

        const uploadArea = document.getElementById('uploadArea');
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });
        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });
        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            const file = e.dataTransfer.files[0];
            if (file && file.type.startsWith('image/')) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageData = e.target.result;
                    document.getElementById('uploadedImage').src = e.target.result;
                    document.getElementById('uploadedImage').style.display = 'block';
                    document.querySelector('.upload-area').style.borderStyle = 'solid';
                };
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
